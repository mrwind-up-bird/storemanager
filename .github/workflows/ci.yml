name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ───────────────────────────── Lint · Typecheck · Unit/Integration ─────────────────────────────
  lint-typecheck-test:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # vitest integration tests use @testcontainers/postgresql → need the Docker socket
      # (available by default on ubuntu-latest runners).
      - run: pnpm test

  # ───────────────────────────── Build Next.js + Docker image ─────────────────────────────
  build:
    name: Build standalone image
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Sanity: a host `next build` succeeds with minimal env (the Docker build supplies its
      # own build-time ENV, see Dockerfile builder stage).
      - name: Build Next.js (host sanity check)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DATABASE_URL: postgresql://qr_app:x@localhost:5432/qrecords
          DATABASE_OWNER_URL: postgresql://qr_owner:x@localhost:5432/qrecords
          PGBOSS_DATABASE_URL: postgresql://qr_owner:x@localhost:5432/qrecords
          ROOT_DOMAIN: localhost
          APP_PROTOCOL: http
          APP_PORT: '3000'
          AUTH_SECRET: ci-build-placeholder-secret-min-32-characters
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          ENCRYPTION_KEY_ID: v1
          MAIL_DRIVER: console
          MAIL_HOST: localhost
          MAIL_PORT: '1025'
          MAIL_FROM: noreply@localhost
          # Always-required by src/env.ts; the /api/billing/webhook route pulls @/env during
          # build-time page-data collection, so `next build` needs them (placeholders — the
          # Dockerfile builder sets its own).
          DISCOGS_CONSUMER_KEY: build-time-placeholder-discogs-key
          DISCOGS_CONSUMER_SECRET: build-time-placeholder-discogs-secret

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────── E2E acceptance (docker compose) ─────────────────────────────
  e2e:
    name: E2E acceptance (docker compose)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Playwright (chromium)
        run: pnpm exec playwright install --with-deps chromium

      # *.localhost resolves automatically in Chromium, but the node-side APIRequestContext
      # (isolation/mailpit specs) needs OS resolution on Linux runners.
      - name: Map *.localhost subdomains to loopback
        run: |
          sudo tee -a /etc/hosts >/dev/null <<'EOF'
          127.0.0.1 demo.localhost
          127.0.0.1 vinylcave.localhost
          127.0.0.1 nope.localhost
          127.0.0.1 www.localhost
          EOF

      # `up` runs db → migrate → seed → web/worker/mailpit. seed is on by default (no profile),
      # so the stack is migrated + seeded before web becomes healthy. --wait blocks until healthy.
      - name: docker compose up (build + migrate + seed + serve)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Dump compose state
        if: always()
        run: docker compose ps

      - name: Run Playwright E2E acceptance
        run: pnpm e2e
        env:
          E2E_DEMO_EMAIL: admin@demo.test
          E2E_DEMO_PASSWORD: E2eDevPassword1!
          E2E_VC_EMAIL: admin@vinylcave.test
          E2E_VC_PASSWORD: E2eDevPassword1!

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ───────────────────────────── Deploy to qrsm.store (main only) ─────────────────────────────
  deploy:
    name: Deploy (GHCR pull + compose)
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-qrsm-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "${DEPLOY_HOST:-46.224.105.254}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync deploy bundle to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          # Additive (no --delete), -R preserves the docker/postgres/init path. Server-only
          # files (.env, the db volume) are never sent and never removed.
          rsync -azR \
            -e "ssh -i ~/.ssh/id_deploy -p ${DEPLOY_PORT:-22}" \
            docker-compose.prod.yml docker/postgres/init splash \
            "${DEPLOY_USER:-root}@${DEPLOY_HOST:-46.224.105.254}:/opt/storemanager/"

      - name: Pull image, up, health-check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" \
            "${DEPLOY_USER:-root}@${DEPLOY_HOST:-46.224.105.254}" \
            IMAGE_TAG="$IMAGE_TAG" GHCR_USER="$GHCR_USER" GHCR_TOKEN="$GHCR_TOKEN" 'bash -seuo pipefail' <<'REMOTE'
          cd /opt/storemanager
          export IMAGE_TAG="${IMAGE_TAG:-latest}"
          # Authenticate the pull with the workflow's own GITHUB_TOKEN (packages:read) — no
          # persistent registry creds on the host. Logged out again right after the pull.
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f >/dev/null 2>&1 || true
          for i in $(seq 1 20); do
            s="$(docker inspect -f '{{.State.Health.Status}}' qrsm-web 2>/dev/null || echo missing)"
            echo "health attempt $i: $s"
            [ "$s" = "healthy" ] && exit 0
            sleep 6
          done
          echo "qrsm-web did not become healthy in time" >&2
          docker logs --tail 80 qrsm-web || true
          exit 1
          REMOTE
